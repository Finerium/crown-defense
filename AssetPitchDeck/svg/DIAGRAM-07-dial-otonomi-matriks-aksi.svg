.0" y="486.84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">KENDALI GANDA WAJIB</text><rect x="180" y="548" width="640" height="132" rx="14" ry="14" fill="#FFFFFF" stroke="#1E4D7B" stroke-width="3.2"/><rect x="186" y="558" width="8" height="112" rx="4" ry="4" fill="#1E4D7B"/><circle cx="242" cy="614" r="27" fill="#1E4D7B" stroke="none" stroke-width="0"/><text x="242" y="623.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="286" y="604" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F2438" text-anchor="start">ALERT_RECOMMEND</text><text x="286" y="642" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">peringatan dan rekomendasi</text><rect x="180" y="702" width="640" height="132" rx="14" ry="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="3.2"/><rect x="186" y="712" width="8" height="112" rx="4" ry="4" fill="#16A34A"/><circle cx="242" cy="768" r="27" fill="#16A34A" stroke="none" stroke-width="0"/><text x="242" y="777.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0</text><text x="286" y="758" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F2438" text-anchor="start">MONITOR_ONLY</text><text x="286" y="796" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">pemantauan saja</text><path d="M 736 747.52 l 8.58 9.36 l 16.38 -20.28" fill="none" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="770" width="280" height="36" rx="9" ry="9" fill="#16A34A"/><text x="660.0" y="794.84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BAWAAN, PALING AMAN</text><line x1="112" y1="250" x2="112" y2="826" stroke="#0F2438" stroke-width="7" stroke-linecap="round" marker-end="url(#a-dark)"/><text x="76" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2438" text-anchor="middle" transform="rotate(-90 76 538)">FAIL-SAFE</text><rect x="60" y="870" width="760" height="180" rx="14" ry="14" fill="#EEF2F6" stroke="#0F2438" stroke-width="2.8"/><rect x="66" y="880" width="8" height="160" rx="4" ry="4" fill="#0F2438"/><text x="92" y="916" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2438" text-anchor="start">Fail-safe: kegagalan selalu menurunkan</text><text x="92" y="950" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2438" text-anchor="start">ke posisi yang lebih aman.</text><text x="92" y="988" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Tidak pernah menaikkan ke tindakan destruktif.</text><text x="92" y="1020" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Control plane putus, posisi efektif menjadi MONITOR_ONLY.</text><text x="880" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#0F2438" text-anchor="start">Matriks klasifikasi tindakan</text><text x="880" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Kelas sebuah tindakan bergantung pada posisi dial saat itu.</text><rect x="880" y="240" width="340" height="120" rx="14" ry="14" fill="#16A34A" stroke="#16A34A" stroke-width="2.5"/><path d="M 900 277.52 l 8.58 9.36 l 16.38