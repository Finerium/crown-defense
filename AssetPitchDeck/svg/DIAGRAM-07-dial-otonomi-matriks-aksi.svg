anchor="start">OTOMATIS</text><text x="1658" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#FFFFFF" text-anchor="start">NEVER_AUTO</text><rect x="1600" y="370" width="340" height="406" rx="14" ry="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="902" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F2438" text-anchor="start">Selalu, non-destruktif:</text><text x="902" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E4D7B" text-anchor="start">ALERT_RAISED</text><text x="902" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E4D7B" text-anchor="start">RECOMMENDATION_MADE</text><text x="902" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E4D7B" text-anchor="start">LLM_REPORT_GENERATED</text><text x="902" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E4D7B" text-anchor="start">DIAL_CHANGED</text><text x="902" y="586" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F2438" text-anchor="start">Destruktif, hanya pada:</text><text x="902" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E4D7B" text-anchor="start">FULL_AUTO</text><text x="902" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">ISOLATE_HOST</text><text x="902" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">KILL_PROCESS</text><text x="902" y="706" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">LOCK_SHARES</text><text x="902" y="750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Semua tercatat di audit.</text><text x="1262" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F2438" text-anchor="start">Destruktif, pada posisi:</text><text x="1262" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E4D7B" text-anchor="start">HUMAN_GATED</text><text x="1262" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">ISOLATE_HOST</text><text x="1262" y="508" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">KILL_PROCESS</text><text x="1262" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">LOCK_SHARES</text><text x="1262" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F2438" text-anchor="start">Pembalikan, selalu:</text><text x="1262" y="614" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E4D7B" text-anchor="start">RELEASE_HOST</text><text x="1262" y="644" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E4D7B" text-anchor="start">UNLOCK_SHARES</text><text x="1262" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Wajib penyetuju kedua</text><text x="1262" y="718" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">yang berbeda dari</text><text x="1262" y="746" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">pemohon.</text><text x="1622" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F2438" text-anchor="start">Destruktif, pada posisi:</text><text x="1622" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E4D7B" text-anchor="start">MONITOR_ONLY</text><text x="1622" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1E4D7B" text-anchor="start">ALERT_RECOMMEND</text><text x="1622" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F2438" text-anchor="start">Dan saat fail-safe:</text><text x="1622" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">control plane putus,</text><text x="1622" y="588" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">posisi efektif turun</text><text x="1622" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">ke MONITOR_ONLY.</text><text x="1622" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Tidak pernah dieksekusi</text><text x="1622" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">otomatis. Hanya dicatat</text><text x="1622" y="716" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">dan direkomendasikan.</text><rect x="880" y="820" width="1060" height="230" rx="14" ry="14" fill="#EEF2F6" 