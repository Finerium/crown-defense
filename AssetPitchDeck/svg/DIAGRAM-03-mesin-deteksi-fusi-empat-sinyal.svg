<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1170" viewBox="0 0 2000 1170"><rect x="0" y="0" width="2000" height="1170" fill="#FFFFFF"/><defs><marker id="ar-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#1E4D7B"/></marker><marker id="ar-dark" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#0F2438"/></marker><marker id="ar-amber" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#D97706"/></marker><marker id="ar-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#16A34A"/></marker><marker id="ar-red" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#DC2626"/></marker></defs><text x="70" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#0F2438" text-anchor="start">Mesin deteksi Crown Defense, fusi empat sinyal</text><rect x="60" y="190" width="520" height="130" rx="14" ry="14" fill="#FFFFFF" stroke="#0F2438" stroke-width="3.5"/><text x="80" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F2438" text-anchor="start">Berkas umpan (canary)</text><text x="80" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">berkas jebakan diubah, jalur cepat</text><rect x="80" y="280" width="232" height="32" rx="16" ry="16" fill="#0F2438" stroke="#0F2438" stroke-width="2.5"/><path d="M105.0 285 L116 296.0 L105.0 307 L94 296.0 Z" fill="#FFFFFF"/><text x="124" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="start">DISKRIMINATIF</text><line x1="580" y1="255" x2="650" y2="255" stroke="#1E4D7B" stroke-width="3.5" marker-end="url(#ar-blue)"/><rect x="60" y="350" width="520" height="130" rx="14" ry="14" fill="#FFFFFF" stroke="#64748B" stroke-width="3.5"/><text x="80" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F2438" text-anchor="start">Lonjakan entropi</text><text x="80" y="424" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">entropi naik dari rendah ke tinggi</text><rect x="80" y="440" width="152" height="32" rx="16" ry="16" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/><circle cx="105.0" cy="456.0" r="9.5" fill="none" stroke="#64748B" stroke-width="2.5"/><text x="124" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#64748B" text-anchor="start">KONTEKS</text><line x1="580" y1="415" x2="650" y2="415" stroke="#1E4D7B" stroke-width="3.5" marker-end="url(#ar-blue)"/><rect x="60" y="510" width="520" height="130" rx="14" ry="14" fill="#FFFFFF" stroke="#64748B" stroke-width="3.5"/><text x="80" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F2438" text-anchor="start">Frekuensi operasi berkas</text><text x="80" y="584" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">laju tulis dan ganti nama melonjak</text><rect x="80" y="600" width="152" height="32" rx="16" ry="16" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/><circle cx="105.0" cy="616.0" r="9.5" fill="none" stroke="#64748B" stroke-width="2.5"/><text x="124" y="622" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#64748B" text-anchor="start">KONTEKS</text><line x1="580" y1="575" x2="650" y2="575" stroke="#1E4D7B" stroke-width="3.5" marker-end="url(#ar-blue)"/><rect x="60" y="670" width="520" height="130" rx="14" ry="14" fill="#FFFFFF" stroke="#0F2438" stroke-width="3.5"/><text x="80" y="712" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F2438" text-anchor="start">Validasi format berkas</text><text x="80" y="744" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">struktur internal berkas rusak</text><rect x="80" y="760" width="232" height="32" rx="16" ry="16" fill="#0F2438" stroke="#0F2438" stroke-width="2.5"/><path d="M105.0 765 L116 776.0 L105.0 787 L94 776.0 Z" fill="#FFFFFF"/><text x="124" y="782" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="start">DISKRIMINATIF</text><line x1="580" y1="735" x2="650" y2="735" stroke="#1E4D7B" stroke-width="3.5" marker-end="url(#ar-blue)"/><rect x="660" y="230" width="700" height="560" rx="16" ry="16" fill="#EEF2F6" stroke="#0F2438" stroke-width="4"/><text x="686" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0F2438" text-anchor="start">Fusi sinyal, Detection Engine</text><text x="686" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">packages/detection/src/fusion.ts</text><rect x="686" y="344" width="648" height="180" rx="12" ry="12" fill="#FFFFFF" stroke="#1E4D7B" stroke-width="3"/><text x="710" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F2438" text-anchor="start">Minimal dua sinyal saling menguatkan</text><text x="710" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F2438" text-anchor="start">DAN minimal satu bersifat diskriminatif,</text><text x="710" y="476" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F2438" text-anchor="start">kecuali jalur cepat berkas umpan.</text><text x="686" y="568" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">corroborating_count hanya menghitung sinyal yang</text><text x="686" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">benar-benar menyala, bukan laporan diri.</text><text x="686" y="636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Ambang bawaan minCorroboration = 2, dapat dikonfigurasi.</text><text x="686" y="672" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Jika verdict gagal lolos validasi skema C2, tindakan</text><text x="686" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">otomatis diturunkan menjadi ALERT.</text><rect x="1420" y="250" width="520" height="150" rx="14" ry="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/><path d="M4 13 L10 19.5 L20 5.5" fill="none" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(1444,272) scale(1.4167)"/><text x="1492" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F2438" text-anchor="start">BENIGN</text><text x="1444" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">jinak, tidak ada sinyal menyala</text><text x="1444" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#16A34A" text-anchor="start">Tindakan: NONE</text><rect x="1420" y="430" width="520" height="150" rx="14" ry="14" fill="#FFFFFF" stroke="#D97706" stroke-width="4"/><g transform="translate(1444,452) scale(1.4167)"><path d="M12 3 L22 20 L2 20 Z" fill="none" stroke="#D97706" stroke-width="3.2" stroke-linejoin="round"/><path d="M12 9 L12 14" stroke="#D97706" stroke-width="3.2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.2" fill="#D97706"/></g><text x="1492" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F2438" text-anchor="start">SUSPICIOUS</text><text x="1444" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">mencurigakan, sinyal belum cukup</text><text x="1444" y="558" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#D97706" text-anchor="start">Tindakan: ALERT</text><rect x="1420" y="610" width="520" height="180" rx="14" ry="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="4"/><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="#DC2626" stroke-width="3.2" stroke-linecap="round" transform="translate(1444,632) scale(1.4167)"/><text x="1492" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F2438" text-anchor="start">MASS_ENCRYPTION</text><text x="1444" y="698" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">enkripsi massal, satu-satunya verdict</text><text x="1444" y="726" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">yang boleh merekomendasikan ISOLATE_HOST</text><text x="1444" y="768" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#DC2626" text-anchor="start">Tindakan: ISOLATE_HOST</text><line x1="1360" y1="325" x2="1410" y2="325" stroke="#1E4D7B" stroke-width="3.5" marker-end="url(#ar-blue)"/><line x1="1360" y1="505" x2="1410" y2="505" stroke="#1E4D7B" stroke-width="3.5" marker-end="url(#ar-blue)"/><line x1="1360" y1="700" x2="1410" y2="700" stroke="#1E4D7B" stroke-width="3.5" marker-end="url(#ar-blue)"/><rect x="660" y="810" width="700" height="64" rx="32" ry="32" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/><path d="M4 13 L10 19.5 L20 5.5" fill="none" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(688,826) scale(1.3333)"/><text x="734" y="850" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2438" text-anchor="start">Fail-closed, ragu berarti tidak merusak</text><rect x="660" y="884" width="700" height="64" rx="32" ry="32" fill="#FFFFFF" stroke="#1E4D7B" stroke-width="3"/><path d="M704.0 900 L718 914.0 L704.0 928 L690 914.0 Z" fill="#1E4D7B"/><text x="734" y="924" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2438" text-anchor="start">Allow-list bertanda tangan, dapat diaudit</text><rect x="60" y="970" width="1300" height="100" rx="12" ry="12" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2.5"/><text x="86" y="1012" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">Implementasi menambah satu sinyal konteks, perubahan tipe/header berkas,</text><text x="86" y="1044" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">sehingga total lima evaluator sinyal.</text><text x="60" y="1122" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Sumber: packages/detection/src/signals.ts, packages/detection/src/fusion.ts, docs/contracts.md (kontrak C2).</text></svg>