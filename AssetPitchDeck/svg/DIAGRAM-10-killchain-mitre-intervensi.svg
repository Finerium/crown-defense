t="normal" fill="#64748B" text-anchor="start">Berkas dienkripsi</text><text x="1636" y="742" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#64748B" text-anchor="start">secara masif.</text><line x1="319" y1="675.0" x2="351" y2="675.0" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#a-red)"/><line x1="633" y1="675.0" x2="665" y2="675.0" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#a-red)"/><line x1="947" y1="675.0" x2="979" y2="675.0" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#a-red)"/><line x1="1261" y1="675.0" x2="1293" y2="675.0" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#a-red)"/><line x1="1575" y1="675.0" x2="1607" y2="675.0" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#a-red)"/><line x1="720.0" y1="384" x2="1434.0" y2="552" stroke="#16A34A" stroke-width="3" stroke-linecap="round" marker-end="url(#a-green)" stroke-dasharray="12 9"/><line x1="1180.0" y1="384" x2="1748.0" y2="552" stroke="#16A34A" stroke-width="3" stroke-linecap="round" marker-end="url(#a-green)" stroke-dasharray="12 9"/><line x1="1670.0" y1="384" x2="1884" y2="552" stroke="#16A34A" stroke-width="3" stroke-linecap="round" marker-end="url(#a-green)" stroke-dasharray="12 9"/><rect x="1298" y="830" width="642" height="110" rx="14" ry="14" fill="#EEF2F6" stroke="#16A34A" stroke-width="3"/><rect x="1304" y="840" width="8" height="90" rx="4" ry="4" fill="#16A34A"/><path d="M 1330 871.52 l 8.58 9.36 l 16.38 -20.28" fill="none" stroke="#16A34A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1372" y="880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2438" text-anchor="start">Rantai serangan berhenti di sini.</text><text x="1330" y="916" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Host terputus, enkripsi lanjutan tidak terjadi.</text><text x="42" y="880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="normal" fill="#64748B" text-anchor="start">Crown Defense tidak berusaha menghentikan seluruh rantai, melainkan</text><text x="42" y="912" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="normal" fill="#64748B" text-anchor="start">memusatkan kekuatan pada tiga titik paling menentukan.</text><text x="42" y="990" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Kode teknik mengikuti MITRE ATT&amp;CK: T1562 Impair Defenses, T1490 Inhibit System Recovery, T1486 Data Encrypted for Impact.</text><text x="42" y="1044" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Sumber: proposal Crown Defense dan pemetaan MITRE ATT&amp;CK; deteksi diimplementasikan di packages/detection/src/.</text></svg>