<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1300" viewBox="0 0 2000 1300"><rect x="0" y="0" width="2000" height="1300" fill="#FFFFFF"/><defs><marker id="ar-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#1E4D7B"/></marker><marker id="ar-dark" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#0F2438"/></marker><marker id="ar-amber" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#D97706"/></marker><marker id="ar-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#16A34A"/></marker><marker id="ar-red" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#DC2626"/></marker></defs><text x="70" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#0F2438" text-anchor="start">Kenapa entropi saja gagal, dan apa yang menangkapnya</text><rect x="60" y="170" width="900" height="590" rx="16" ry="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><text x="86" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#0F2438" text-anchor="start">Enkripsi penuh</text><text x="86" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">berkas teks, seluruh isi ditimpa data terenkripsi</text><text x="86" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Ilustrasi isi berkas dibagi 16 blok</text><rect x="86" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="96" y1="392" x2="127" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="139" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="149" y1="392" x2="180" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="192" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="202" y1="392" x2="233" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="245" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="255" y1="392" x2="286" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="298" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="308" y1="392" x2="339" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="351" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="361" y1="392" x2="392" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="404" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="414" y1="392" x2="445" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="457" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="467" y1="392" x2="498" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="510" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="520" y1="392" x2="551" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="563" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="573" y1="392" x2="604" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="616" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="626" y1="392" x2="657" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="669" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="679" y1="392" x2="710" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="722" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="732" y1="392" x2="763" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="775" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="785" y1="392" x2="816" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="828" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="838" y1="392" x2="869" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="881" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="891" y1="392" x2="922" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="86" y="414" width="26" height="26" rx="5" fill="#DC2626"/><line x1="91" y1="436" x2="107" y2="418" stroke="#FFFFFF" stroke-width="2.5"/><text x="122" y="435" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#64748B" text-anchor="start">blok ditimpa data terenkripsi</text><rect x="460" y="414" width="26" height="26" rx="5" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><text x="496" y="435" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#64748B" text-anchor="start">blok asli, tidak disentuh</text><text x="86" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Meter entropi Shannon, skala 0 sampai 8</text><text x="86" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#0F2438" text-anchor="start">sebelum</text><rect x="210" y="492" width="560" height="30" rx="6" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="210" y="492" width="303.5" height="30" rx="6" fill="#1E4D7B"/><text x="786" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0F2438" text-anchor="start">4,336</text><text x="86" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#0F2438" text-anchor="start">sesudah</text><rect x="210" y="538" width="560" height="30" rx="6" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="210" y="538" width="557.6" height="30" rx="6" fill="#1E4D7B"/><text x="786" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0F2438" text-anchor="start">7,966</text><text x="86" y="622" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2438" text-anchor="start">Delta entropi 3,63. Sinyal ENTROPY_DELTA menyala.</text><rect x="86" y="644" width="848" height="92" rx="12" ry="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/><path d="M4 13 L10 19.5 L20 5.5" fill="none" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(116,668) scale(1.6667)"/><text x="176" y="702" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#16A34A" text-anchor="start">Detektor entropi: TERTANGKAP</text><rect x="1040" y="170" width="900" height="590" rx="16" ry="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/><text x="1066" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#0F2438" text-anchor="start">Enkripsi terputus (intermittent)</text><text x="1066" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">berkas dokumen, hanya sebagian blok ditimpa dengan sengaja</text><text x="1066" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Ilustrasi isi berkas dibagi 16 blok</text><rect x="1066" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="1076" y1="392" x2="1107" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="1119" y="320" width="51" height="80" rx="4" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1172" y="320" width="51" height="80" rx="4" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1225" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="1235" y1="392" x2="1266" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="1278" y="320" width="51" height="80" rx="4" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1331" y="320" width="51" height="80" rx="4" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1384" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="1394" y1="392" x2="1425" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="1437" y="320" width="51" height="80" rx="4" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1490" y="320" width="51" height="80" rx="4" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1543" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="1553" y1="392" x2="1584" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="1596" y="320" width="51" height="80" rx="4" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1649" y="320" width="51" height="80" rx="4" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1702" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="1712" y1="392" x2="1743" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="1755" y="320" width="51" height="80" rx="4" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1808" y="320" width="51" height="80" rx="4" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1861" y="320" width="51" height="80" rx="4" fill="#DC2626"/><line x1="1871" y1="392" x2="1902" y2="328" stroke="#FFFFFF" stroke-width="3"/><rect x="1066" y="414" width="26" height="26" rx="5" fill="#DC2626"/><line x1="1071" y1="436" x2="1087" y2="418" stroke="#FFFFFF" stroke-width="2.5"/><text x="1102" y="435" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#64748B" text-anchor="start">blok ditimpa data terenkripsi</text><rect x="1440" y="414" width="26" height="26" rx="5" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><text x="1476" y="435" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#64748B" text-anchor="start">blok asli, tidak disentuh</text><text x="1066" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Meter entropi Shannon, skala 0 sampai 8</text><text x="1066" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#0F2438" text-anchor="start">sebelum</text><rect x="1190" y="492" width="560" height="30" rx="6" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1190" y="492" width="557.7" height="30" rx="6" fill="#1E4D7B"/><text x="1766" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0F2438" text-anchor="start">7,967</text><text x="1066" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#0F2438" text-anchor="start">sesudah</text><rect x="1190" y="538" width="560" height="30" rx="6" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><rect x="1190" y="538" width="557.6" height="30" rx="6" fill="#1E4D7B"/><text x="1766" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0F2438" text-anchor="start">7,966</text><text x="1066" y="622" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F2438" text-anchor="start">Delta entropi 0,00. Entropi nyaris tidak berubah, sengaja.</text><rect x="1066" y="644" width="848" height="92" rx="12" ry="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="4"/><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="#DC2626" stroke-width="3.2" stroke-linecap="round" transform="translate(1096,668) scale(1.6667)"/><text x="1156" y="702" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#DC2626" text-anchor="start">Detektor entropi saja: LOLOS</text><rect x="60" y="790" width="900" height="290" rx="16" ry="16" fill="#EEF2F6" stroke="#64748B" stroke-width="4"/><text x="86" y="842" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0F2438" text-anchor="start">Batas sinyal entropi</text><text x="86" y="884" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Kompresi juga menaikkan entropi, sehingga entropi tinggi</text><text x="86" y="918" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">bukan bukti enkripsi.</text><text x="86" y="952" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Berkas dokumen dan gambar sudah berentropi tinggi sejak awal,</text><text x="86" y="986" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">sehingga delta entropi tetap mendekati nol.</text><text x="86" y="1020" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Karena itu entropi dipakai sebagai sinyal KONTEKS, bukan penentu.</text><line x1="1490" y1="760" x2="1490" y2="784" stroke="#16A34A" stroke-width="4" marker-end="url(#ar-green)"/><rect x="1040" y="790" width="900" height="290" rx="16" ry="16" fill="#EEF2F6" stroke="#16A34A" stroke-width="4"/><text x="1066" y="842" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0F2438" text-anchor="start">Validasi format berkas</text><text x="1066" y="876" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">memeriksa struktur internal, bukan keacakan byte</text><rect x="1066" y="896" width="300" height="118" rx="10" ry="10" fill="#FFFFFF" stroke="#0F2438" stroke-width="3"/><rect x="1076" y="904" width="280" height="30" rx="5" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><text x="1086" y="925" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#64748B" text-anchor="start">header berkas</text><rect x="1076" y="940" width="280" height="30" rx="5" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="2"/><text x="1086" y="961" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#64748B" text-anchor="start">isi data blok</text><rect x="1076" y="976" width="280" height="30" rx="5" fill="#DC2626" fill-opacity="0.18" stroke="#DC2626" stroke-width="2"/><text x="1086" y="997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#7F1D1D" text-anchor="start">CRC / checksum</text><path d="M1268 978 L1282 991 L1266 996 L1280 1006" fill="none" stroke="#DC2626" stroke-width="3"/><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="#DC2626" stroke-width="3.4" stroke-linecap="round" transform="translate(1318,979) scale(1.0000)"/><path d="M4 13 L10 19.5 L20 5.5" fill="none" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(1400,924) scale(1.5833)"/><text x="1452" y="946" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16A34A" text-anchor="start">Validasi format: TERTANGKAP,</text><text x="1452" y="976" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16A34A" text-anchor="start">struktur internal rusak</text><text x="1400" y="1016" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">sinyal FORMAT_VALIDATION_FAIL menyala</text><rect x="60" y="1108" width="1880" height="88" rx="14" ry="14" fill="#0F2438" stroke="#0F2438" stroke-width="3"/><text x="1000" y="1164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Inilah sebabnya entropi saja tidak cukup. Validasi format menutup celah enkripsi terputus.</text><text x="70" y="1240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Sumber: reports/sim/modes.json. Angka entropi diambil apa adanya dari matriks mode, berkas txt untuk mode FULL dan berkas png untuk mode INTERMITTENT_EVERY_N_BYTES.</text><text x="70" y="1270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Celah yang diakui: pada berkas jpg, enkripsi terputus belum tertangkap andal di tingkat berkas tunggal, dan dipertahankan di tingkat host lewat frekuensi operasi.</text></svg>