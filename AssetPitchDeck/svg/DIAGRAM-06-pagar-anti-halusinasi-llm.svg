<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1410" viewBox="0 0 2000 1410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="2000" height="1410" fill="#FFFFFF"/><defs><marker id="a-mid" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 18 9 L 0 18 Z" fill="#1E4D7B"/></marker><marker id="a-dark" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 18 9 L 0 18 Z" fill="#0F2438"/></marker><marker id="a-red" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 18 9 L 0 18 Z" fill="#DC2626"/></marker><marker id="a-green" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 18 9 L 0 18 Z" fill="#16A34A"/></marker><marker id="a-slate" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 18 9 L 0 18 Z" fill="#64748B"/></marker><marker id="a-amber" viewBox="0 0 18 18" refX="16" refY="9" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 18 9 L 0 18 Z" fill="#D97706"/></marker></defs><text x="60" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="bold" fill="#0F2438" text-anchor="start">Pagar anti-halusinasi pada lapisan orkestrasi AI</text><text x="60" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#64748B" text-anchor="start">Setiap keluaran model wajib melewati empat pagar sebelum boleh ditampilkan sebagai analisis resmi.</text><rect x="340" y="150" width="820" height="110" rx="14" ry="14" fill="#1E4D7B" stroke="#0F2438" stroke-width="3"/><text x="370" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="start">Keluaran model bahasa</text><text x="370" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#C8D8E8" text-anchor="start">Produksi: model swakelola. Purwarupa: API. Suhu 0,1.</text><rect x="340" y="310" width="820" height="180" rx="14" ry="14" fill="#EEF2F6" stroke="#1E4D7B" stroke-width="2.5"/><rect x="346" y="320" width="8" height="160" rx="4" ry="4" fill="#1E4D7B"/><rect x="370" y="332" width="124" height="36" rx="9" ry="9" fill="#1E4D7B"/><text x="432.0" y="357.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PAGAR 1</text><text x="518" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F2438" text-anchor="start">Pembumian lewat pengambilan (RAG)</text><text x="370" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">retrieve() mengambil 6 pasase paling relevan dari playbook</text><text x="370" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">respons insiden internal, turunan NIST SP 800-61 dan MITRE</text><text x="370" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">ATT&amp;CK. Prompt melarang model mengarang id pasase.</text><rect x="340" y="540" width="820" height="150" rx="14" ry="14" fill="#EEF2F6" stroke="#1E4D7B" stroke-width="2.5"/><rect x="346" y="550" width="8" height="130" rx="4" ry="4" fill="#1E4D7B"/><rect x="370" y="562" width="124" height="36" rx="9" ry="9" fill="#1E4D7B"/><text x="432.0" y="587.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PAGAR 2</text><text x="518" y="588" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F2438" text-anchor="start">Validasi skema ketat</text><text x="370" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">extractJson() lalu Zod safeParse terhadap IncidentReport</text><text x="370" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">dan RecoveryPlan. Keluaran cacat tidak pernah lolos.</text><rect x="340" y="740" width="820" height="200" rx="14" ry="14" fill="#EEF2F6" stroke="#1E4D7B" stroke-width="2.5"/><rect x="346" y="750" width="8" height="180" rx="4" ry="4" fill="#1E4D7B"/><rect x="370" y="762" width="124" height="36" rx="9" ry="9" fill="#1E4D7B"/><text x="432.0" y="787.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PAGAR 3</text><text x="518" y="788" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F2438" text-anchor="start">Gerbang kesetiaan (faithfulness gate)</text><text x="370" y="830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">Setiap langkah pemulihan dan setiap kutipan wajib menunjuk</text><text x="370" y="860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">id pasase yang benar-benar diambil, dan berbagi minimal 2</text><text x="370" y="890" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">istilah bermakna dengan pasase itu. LULUS bila skor lebih</text><text x="370" y="920" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">besar atau sama dengan 0,8 DAN tidak ada kutipan fiktif.</text><rect x="340" y="990" width="820" height="160" rx="14" ry="14" fill="#EEF2F6" stroke="#1E4D7B" stroke-width="2.5"/><rect x="346" y="1000" width="8" height="140" rx="4" ry="4" fill="#1E4D7B"/><rect x="370" y="1012" width="124" height="36" rx="9" ry="9" fill="#1E4D7B"/><text x="432.0" y="1037.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PAGAR 4</text><text x="518" y="1038" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F2438" text-anchor="start">Bentuk keluaran dikunci ke C7</text><text x="370" y="1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">Hanya laporan insiden, peta radius dampak, dan rencana</text><text x="370" y="1110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">pemulihan. Tidak pernah ActionRecord atau AgentCommand.</text><text x="370" y="1140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#64748B" text-anchor="start">Peta radius dampak dihitung dari data insiden, bukan model.</text><line x1="750.0" y1="260" x2="750.0" y2="306" stroke="#0F2438" stroke-width="4" stroke-linecap="round" marker-end="url(#a-dark)"/><line x1="750.0" y1="490" x2="750.0" y2="536" stroke="#0F2438" stroke-width="4" stroke-linecap="round" marker-end="url(#a-dark)"/><line x1="750.0" y1="690" x2="750.0" y2="736" stroke="#0F2438" stroke-width="4" stroke-linecap="round" marker-end="url(#a-dark)"/><line x1="750.0" y1="940" x2="750.0" y2="986" stroke="#0F2438" stroke-width="4" stroke-linecap="round" marker-end="url(#a-dark)"/><rect x="340" y="1200" width="1610" height="120" rx="14" ry="14" fill="#EEF2F6" stroke="#16A34A" stroke-width="3"/><rect x="346" y="1210" width="8" height="100" rx="4" ry="4" fill="#16A34A"/><path d="M 372 1238.56 l 9.24 10.08 l 17.64 -21.84" fill="none" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="418" y="1250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0F2438" text-anchor="start">Status akhir: penasihat saja.</text><text x="372" y="1292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#64748B" text-anchor="start">Lapisan AI tidak pernah mengeksekusi apa pun. Tindakan destruktif tetap tunduk pada dial otonomi.</text><rect x="1250" y="150" width="700" height="200" rx="14" ry="14" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/><rect x="1256" y="160" width="8" height="180" rx="4" ry="4" fill="#D97706"/><path d="M 1295.0 174 L 1308 196.88 L 1282 196.88 Z" fill="none" stroke="#D97706" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1326" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F2438" text-anchor="start">Model tidak tersedia</text><text x="1282" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">status: LLM_UNAVAILABLE, degraded = true</text><text x="1282" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Deteksi dan containment TETAP berjalan.</text><text x="1282" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Tidak ada tindakan destruktif baru.</text><text x="1282" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Sistem merosot ke posisi yang lebih aman.</text><rect x="1250" y="540" width="700" height="150" rx="14" ry="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/><rect x="1256" y="550" width="8" height="130" rx="4" ry="4" fill="#DC2626"/><path d="M 1282 566 l 22 22 M 1304 566 l -22 22" fill="none" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1326" y="588" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F2438" text-anchor="start">Keluaran tidak sesuai skema</text><text x="1282" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">status: MALFORMED_OUTPUT</text><text x="1282" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">routed_to_human = true. Tidak ditampilkan.</text><rect x="1250" y="740" width="700" height="200" rx="14" ry="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/><rect x="1256" y="750" width="8" height="180" rx="4" ry="4" fill="#DC2626"/><path d="M 1282 766 l 22 22 M 1304 766 l -22 22" fill="none" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1326" y="788" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F2438" text-anchor="start">Gagal gerbang kesetiaan</text><text x="1282" y="830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">status: BLOCKED_LOW_FAITHFULNESS</text><text x="1282" y="860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">routed_to_human = true</text><text x="1282" y="890" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Tidak ditampilkan sebagai fakta.</text><text x="1282" y="920" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="normal" fill="#64748B" text-anchor="start">Dirutekan ke analis manusia untuk ditinjau.</text><rect x="1250" y="990" width="700" height="160" rx="14" ry="14" fill="#0F2438" stroke="#0F2438" stroke-width="3"/><text x="1282" y="1038" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="start">Prinsip yang ditegakkan</text><text x="1282" y="1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#C8D8E8" text-anchor="start">Penolakan yang aman lebih baik daripada</text><text x="1282" y="1112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#C8D8E8" text-anchor="start">jawaban lancar yang tidak berdasar.</text><line x1="1160" y1="218" x2="1244" y2="218" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" marker-end="url(#a-amber)"/><line x1="1160" y1="615" x2="1244" y2="615" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round" marker-end="url(#a-red)"/><line x1="1160" y1="840" x2="1244" y2="840" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round" marker-end="url(#a-red)"/><text x="1172" y="207" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#D97706" text-anchor="start">gagal</text><text x="1172" y="604" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#DC2626" text-anchor="start">gagal</text><text x="1172" y="829" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#DC2626" text-anchor="start">gagal</text><text x="60" y="1372" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#64748B" text-anchor="start">Sumber: packages/llm/src/orchestrator.ts, packages/llm/src/faithfulness.ts, packages/llm/src/playbook.ts</text></svg>